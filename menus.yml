# ======================================================================
#  MENU GUI - mọi menu của server nằm ở đây. Sửa xong: /astraxmenu reload
#  Kiểm tra liên kết giữa các menu: /astraxmenu check
#
#  Mỗi menu:  title, rows (1-6), filler (true/false), items
#  Mỗi nút:   slot (hoặc slots: [..]), material, name, lore, glow, amount,
#             skull-owner (chỉ PLAYER_HEAD), actions (mọi click),
#             left-actions / right-actions (tách chuột trái/phải)
#
#  Hành động (mỗi dòng "[loại] nội dung"):
#    [player] lệnh      người chơi tự gõ lệnh (không cần dấu /)
#    [console] lệnh     console chạy lệnh (chỉ đặt lệnh bạn tin tưởng)
#    [open] menu        mở menu khác trong file này
#    [rank] [id]        mở /rank (hoặc chi tiết một rank)
#    [book] id          mở sách trong guides.yml
#    [close]            đóng menu
#    [message] chữ      gửi tin nhắn
#    [sound] key        phát âm thanh, vd block.note_block.pling
#    [link] url | chữ   gửi liên kết bấm được
#  Biến: {player} {online} {max} {rank} và PlaceholderAPI (%...%).
#  Số ô: hàng 1 = 0-8, hàng 2 = 9-17, ... hàng 6 = 45-53.
# ======================================================================

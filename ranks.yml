# ======================================================================
#  /rank - xem quyền lợi các rank (rank của server làm bằng /kit)
#  Sửa xong gõ /astraxmenu reload. Kiểm tra: /astraxmenu check
#
#  Plugin tự ĐỌC kits.yml của EssentialsX để hiện đúng vật phẩm trong
#  từng kit (chỉ đọc, không sửa). Phần "perks"/"description" là chữ bạn
#  tự viết (quyền lợi ngoài kit: fly, /home thêm, prefix...).
#  >>> CÁC RANK/PERK DƯỚI ĐÂY LÀ MẪU - HÃY SỬA THEO SERVER CỦA BẠN. <<<
# ======================================================================
settings:
  title: "&8✦ &6&lRANK &8✦ &7Quyền lợi"
  detail-title: "&8Rank: {rank}"
  rows: 4                       # 3-6 hàng cho trang danh sách
  slots: [10, 11, 12, 13, 14, 15, 16]   # ô của từng rank theo thứ tự bên dưới (thấp -> cao)
  default-rank-name: "&7Thành viên"
  back-menu: main               # nút quay lại mở menu này ("" = không có nút)
  kit-command: "kit {kit}"      # lệnh chạy khi bấm nhận kit (người chơi tự gõ). Có thể đổi thành "ekit {kit}"...
  require-owned-to-claim: true  # true = chưa có rank thì không chạy lệnh kit
  show-kit-contents: true       # hiện vật phẩm thật trong kit (đọc từ Essentials)
  kits-file: auto               # auto = tự tìm plugins/Essentials/kits.yml. Hoặc đường dẫn tính từ thư mục plugins/

# Chữ hiển thị (có thể đổi). {kit} {price} {rank} {cooldown}
texts:
  status-current: "&6★ Rank hiện tại của bạn"
  status-owned: "&a✔ Bạn đã sở hữu rank này"
  status-locked: "&c✖ Bạn chưa sở hữu rank này"
  perks-title: "&6Quyền lợi:"
  kit-line: "&eKit: &f/kit {kit}"
  kit-cooldown: "&7Hồi kit: &f{cooldown}"
  kit-once: "Chỉ dùng 1 lần"
  kit-nocd: "Không hồi"
  price-line: "&7Cách nhận: &f{price}"
  hint-left: "&eChuột trái: &7xem vật phẩm trong kit"
  hint-right: "&eChuột phải: &7nhận kit &f/kit {kit}"
  header-name: "&e{player}"
  header-current: "&7Rank của bạn: {rank}"
  header-hint-1: "&eChuột trái &7vào rank: xem vật phẩm trong kit"
  header-hint-2: "&eChuột phải &7vào rank: nhận kit"
  back: "&c« Quay lại menu"
  close: "&cĐóng"
  back-list: "&c« Danh sách rank"
  claim-name: "&a&lNhận kit /kit {kit}"
  claim-lore: "&7Bấm để chạy lệnh nhận kit."
  more-items: "&7...và &f{n} &7vật phẩm khác"
  no-kit: "&7Rank này không có kit."
  preview-off: "&7Xem trước kit đang tắt."
  kit-unreadable: "&7Không đọc được kit &f{kit}&7 từ kits.yml."
  empty-title: "&cKhông có nội dung để xem trước"
  kit-others: "&7+ {n} phần thưởng đặc biệt khác"

# Mỗi rank:
#   name        tên hiển thị
#   icon        vật phẩm làm biểu tượng
#   kit         tên kit trong /kit ("" = rank không có kit)
#   permission  quyền để coi là "đang có rank" (mặc định group.<id> của LuckPerms).
#               Nếu bạn phân quyền kit bằng essentials.kits.<tên> thì đặt quyền đó ở đây.
#   price       cách nhận rank (chữ tự do)
#   description / perks   dòng chữ hiển thị
